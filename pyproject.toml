[tool.poetry]
name = "knowledge-assistant"
version = "1.0.0"
description = "A LangChain-based agentic application for managing and querying a personal knowledge base"
authors = ["sjitb"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/sjitb/knowledge_assistant"
repository = "https://github.com/sjitb/knowledge_assistant"
keywords = ["langchain", "rag", "knowledge-base", "vector-database", "ai", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "knowledge_assistant"}]

[tool.poetry.dependencies]
python = "^3.8"
langchain = "^0.1.0"
langchain-community = "^0.0.10"
langchain-openai = "^0.0.2"
langchain-core = "^0.1.0"
langchain-text-splitters = "^0.0.1"
chromadb = "^0.4.22"
sentence-transformers = "^2.2.2"
pypdf = "^3.17.4"
python-docx = "^1.1.0"
unstructured = "^0.11.8"
python-dotenv = "^1.0.0"
pyyaml = "^6.0.1"
openai = "^1.7.2"
tiktoken = "^0.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"
isort = "^5.12.0"

[tool.poetry.scripts]
knowledge-assistant = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | build
  | dist
  | chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", ".env", "build", "dist", "chroma_db"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=knowledge_assistant --cov-report=term-missing"
